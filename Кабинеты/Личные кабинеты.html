<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личные кабинеты: школьник и тьютор — прототип</title>
<style>
  :root {
    --navy:#1f3a5f; --teal:#0f6f69; --paper:#f7f8fb; --card:#ffffff;
    --ink:#22303c; --muted:#5c6a77; --line:#e0e5ec;
    --gold:#9a6a1f; --gold-soft:#f6eeda; --ok:#1a7f4b; --ok-soft:#dcefe3;
    --warn:#b3382c; --warn-soft:#f9e9e6; --navy-soft:#e7eef7; --teal-soft:#e1efed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- экран входа ---------- */
  .login-wrap { max-width: 980px; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
  .login-head { text-align: center; margin-bottom: 1.8rem; }
  .login-head .tag {
    display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .09em;
    text-transform: uppercase; color: var(--navy); background: var(--navy-soft);
    border-radius: 999px; padding: .26rem .75rem; margin-bottom: .6rem;
  }
  .login-head h1 { font-size: 1.85rem; line-height: 1.2; margin: .2rem 0 .5rem; color: var(--navy); }
  .login-head p { margin: 0 auto; max-width: 620px; color: var(--muted); font-size: .95rem; }
  .role-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.6rem 0 1.2rem; }
  @media (max-width: 700px) { .role-cards { grid-template-columns: 1fr; } }
  .role-card {
    text-align: left; background: var(--card); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 1.1rem 1.2rem; transition: .15s;
  }
  .role-card:hover { border-color: var(--teal); box-shadow: 0 6px 20px rgba(31,58,95,.08); }
  .role-card.active { border-color: var(--teal); background: #f4faf8; box-shadow: 0 0 0 3px rgba(15,111,105,.12); }
  .role-card b { display: block; color: var(--navy); font-size: 1.05rem; margin-bottom: .2rem; }
  .role-card span { color: var(--muted); font-size: .87rem; line-height: 1.45; }
  .demo-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.2rem; }
  .demo-box h2 { margin: 0 0 .3rem; font-size: 1.05rem; color: var(--navy); }
  .demo-box .note { color: var(--muted); font-size: .85rem; margin: .2rem 0 .8rem; }
  .demo-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .6rem; }
  .demo-item {
    display: flex; justify-content: space-between; align-items: center; gap: .6rem;
    border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; background: #fcfdfe;
  }
  .demo-item small { display: block; color: var(--muted); font-size: .78rem; }
  .btn {
    border: 1px solid var(--teal); background: #fff; color: var(--teal);
    border-radius: 9px; padding: .45rem .9rem; font-size: .87rem; font-weight: 650;
  }
  .btn:hover { background: var(--teal-soft); }
  .btn.solid { background: var(--teal); color: #fff; }
  .btn.solid:hover { filter: brightness(1.08); }
  .btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.ghost { border-color: var(--line); color: var(--navy); background: #fff; }
  .btn.small { font-size: .8rem; padding: .3rem .65rem; }
  .banner {
    margin: 1.4rem 0 0; background: var(--gold-soft); border-left: 4px solid var(--gold);
    border-radius: 0 10px 10px 0; padding: .85rem 1.05rem; font-size: .9rem;
  }
  .banner b { color: var(--gold); }

  /* ---------- каркас кабинета ---------- */
  .cabinet { display: grid; grid-template-columns: 268px 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .cabinet { grid-template-columns: 1fr; } .rail-pupils { display: none; } }
  .rail { background: var(--navy); color: #fff; padding: 1.2rem 1rem; }
  .rail .who { margin-bottom: 1.1rem; }
  .rail .who b { display: block; font-size: 1rem; line-height: 1.3; }
  .rail .who small { color: #b9c8dc; font-size: .8rem; }
  .rail h3 {
    font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
    color: #9fb2ca; margin: 1.1rem 0 .45rem;
  }
  .rail .item {
    display: flex; justify-content: space-between; align-items: center; gap: .5rem;
    width: 100%; text-align: left; border: 0; background: transparent; color: #e6eefb;
    padding: .5rem .6rem; border-radius: 8px; font-size: .9rem;
  }
  .rail .item:hover { background: rgba(255,255,255,.12); }
  .rail .item.active { background: #fff; color: var(--navy); font-weight: 650; }
  .rail .item .cnt { font-size: .74rem; background: rgba(255,255,255,.16); border-radius: 999px; padding: .05rem .45rem; }
  .rail .item.active .cnt { background: var(--navy-soft); color: var(--navy); }
  .rail .switch { margin-top: 1.2rem; display: flex; gap: .4rem; flex-wrap: wrap; }
  .rail .switch button {
    flex: 1 1 auto; border: 1px solid rgba(255,255,255,.35); background: transparent;
    color: #fff; border-radius: 8px; padding: .35rem .5rem; font-size: .78rem;
  }
  .rail .switch button:hover { background: rgba(255,255,255,.14); }

  .main { padding: 1.4rem 1.6rem 2.5rem; min-width: 0; }
  @media (max-width: 640px) { .main { padding: 1rem .9rem 2rem; } }
  .head { display: flex; flex-wrap: wrap; gap: .8rem; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; }
  .head h1 { font-size: 1.45rem; margin: 0 0 .25rem; color: var(--navy); line-height: 1.25; }
  .head .sub { color: var(--muted); font-size: .87rem; }
  .chip {
    display: inline-block; font-size: .75rem; font-weight: 700; border-radius: 999px;
    padding: .18rem .6rem; background: var(--navy-soft); color: var(--navy);
  }
  .chip.teal { background: var(--teal-soft); color: var(--teal); }
  .chip.gold { background: var(--gold-soft); color: var(--gold); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }

  .progress { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem; margin-bottom: 1.1rem; }
  .progress .bar { height: .8rem; background: #eef1f4; border-radius: 999px; overflow: hidden; }
  .progress .fill { height: 100%; background: var(--teal); border-radius: 999px; transition: width .25s; }
  .progress .stats { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; margin-top: .5rem; font-size: .85rem; color: var(--muted); }
  .progress .stats b { color: var(--ink); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1.2rem; }
  .panel h2 { font-size: 1.05rem; margin: 0 0 .2rem; color: var(--navy); }
  .panel .hint { color: var(--muted); font-size: .84rem; margin: 0 0 .8rem; line-height: 1.45; }

  .tabs { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .8rem; }
  .tabs button {
    border: 1px solid var(--line); background: #fff; color: var(--navy);
    border-radius: 999px; padding: .35rem .8rem; font-size: .82rem; font-weight: 600;
  }
  .tabs button.active { background: var(--navy); border-color: var(--navy); color: #fff; }

  .field { margin-bottom: .8rem; }
  .field label { display: block; font-size: .78rem; font-weight: 700; color: var(--muted); margin-bottom: .25rem; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #fbfcfd;
    padding: .5rem .6rem; font-size: .9rem;
  }
  .field textarea { min-height: 4.2rem; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15,111,105,.13); background: #fff;
  }
  .ro-text { font-size: .9rem; line-height: 1.55; background: #fbfcfd; border: 1px solid var(--line);
             border-radius: 9px; padding: .5rem .6rem; white-space: pre-wrap; }
  .doc-section { margin-top: 1rem; padding-top: .8rem; border-top: 1px dashed var(--line); }
  .doc-section:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .doc-section h3 { margin: 0 0 .5rem; font-size: .95rem; color: var(--navy); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  .week-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  .week-table th, .week-table td { border-bottom: 1px solid var(--line); padding: .5rem .45rem; vertical-align: top; text-align: left; }
  .week-table th { background: #f6f7f8; color: var(--navy); font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; }
  .week-table td textarea, .week-table td input, .week-table td select {
    width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: .35rem .45rem;
    font-size: .84rem; background: #fff;
  }
  .week-table td textarea { min-height: 2.6rem; resize: vertical; }
  .week-table tr.done td { background: #f4faf7; }
  .week-table .month-row td { background: var(--navy-soft); color: var(--navy); font-weight: 700; font-size: .8rem; }
  .week-table .w-date { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); font-size: .78rem; }
  .w-check { text-align: center; }
  .w-check input { margin: 0; width: 1rem; height: 1rem; }
  .res-row td { padding-top: 0; }
  .table-wrap { overflow-x: auto; }

  .res-box { border-left: 3px solid var(--gold); background: #fffdf7; border-radius: 0 8px 8px 0; padding: .45rem .6rem; font-size: .8rem; }
  .res-box.empty { border-left-color: var(--line); background: #fbfcfd; color: var(--muted); }
  .res-box b { display: block; color: var(--gold); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .1rem; }
  .res-box .who { color: var(--muted); font-size: .72rem; }

  .pupil-list { display: grid; gap: .5rem; }
  .pupil-row {
    display: grid; grid-template-columns: 1fr 130px 120px; gap: .7rem; align-items: center;
    border: 1px solid var(--line); border-radius: 10px; padding: .55rem .7rem; background: #fcfdfe; cursor: pointer;
  }
  @media (max-width: 720px) { .pupil-row { grid-template-columns: 1fr; } }
  .pupil-row:hover { border-color: var(--teal); }
  .pupil-row.active { border-color: var(--teal); background: #f4faf8; box-shadow: 0 0 0 3px rgba(15,111,105,.1); }
  .pupil-row .nm { font-weight: 650; color: var(--navy); font-size: .92rem; }
  .pupil-row .cl { color: var(--muted); font-size: .78rem; }
  .mini { height: .45rem; background: #eef1f4; border-radius: 999px; overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--teal); border-radius: 999px; }

  .feed { display: grid; gap: .45rem; }
  .feed-item { display: flex; gap: .6rem; font-size: .85rem; border-bottom: 1px dashed var(--line); padding-bottom: .45rem; }
  .feed-item:last-child { border-bottom: 0; }
  .feed-item .t { color: var(--muted); font-size: .78rem; white-space: nowrap; }

  .err-list { display: grid; gap: .6rem; }
  .err-item { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .7rem; background: #fcfdfe; }
  .err-item .top { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: space-between; margin-bottom: .35rem; }
  .err-item .top b { color: var(--navy); font-size: .88rem; }
  .err-line { font-size: .84rem; margin: .12rem 0; }
  .err-line span { color: var(--muted); }
  .refl-list { display: grid; gap: .6rem; }
  .refl-item { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .7rem; background: #fcfdfe; }
  .refl-item .top { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: space-between; align-items: center; margin-bottom: .35rem; }
  .refl-item .top b { color: var(--navy); font-size: .88rem; }
  .lights { display: inline-flex; gap: .25rem; align-items: center; }
  .light { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: .1rem .35rem; font-size: .95rem; line-height: 1.3; }
  .light.active { border-color: var(--teal); background: var(--teal-soft); box-shadow: 0 0 0 2px rgba(15,111,105,.15); }
  .light-hint { font-size: .74rem; color: var(--muted); margin-left: .2rem; }
  .howto { margin: .2rem 0 .9rem; border: 1px solid var(--line); border-radius: 10px; background: #fbfcfd; }
  .howto > summary { cursor: pointer; padding: .5rem .7rem; font-size: .84rem; font-weight: 650; color: var(--navy); }
  .howto-body { padding: 0 .8rem .7rem; font-size: .84rem; line-height: 1.5; }
  .howto-body p { margin: .4rem 0; }
  .howto-body ul { margin: .3rem 0 .5rem 1.1rem; padding: 0; }
  .howto-body li { margin: .22rem 0; }

  .savebar {
    position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    background: rgba(247,248,251,.96); border-top: 1px solid var(--line); padding: .7rem .2rem; margin-top: .4rem;
  }
  .savebar .status { font-size: .82rem; color: var(--muted); flex: 1 1 200px; }
  .status.ok { color: var(--ok); font-weight: 600; }

  .arch { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; }
  .arch table { width: 100%; border-collapse: collapse; font-size: .82rem; margin: .6rem 0; }
  .arch th, .arch td { border: 1px solid var(--line); padding: .4rem .5rem; text-align: left; vertical-align: top; }
  .arch th { background: var(--navy-soft); color: var(--navy); font-size: .74rem; text-transform: uppercase; }
  .arch code { font-family: ui-monospace, Consolas, monospace; font-size: .8rem; background: #f2f4f7; padding: .05rem .3rem; border-radius: 4px; }
  .arch ol { margin: .4rem 0 .4rem 1.1rem; padding: 0; font-size: .87rem; }
  .arch li { margin: .25rem 0; }
  .muted { color: var(--muted); }
  .empty-state { text-align: center; color: var(--muted); padding: 1.6rem .8rem; font-size: .9rem; }
</style>
</head>

  var SESSION_KEY = "iop_session";

  var storageOk = true;

  function readJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { storageOk = false; return fallback; }
  }
  function writeJSON(key, val) {
    if (!storageOk) return;
    try { localStorage.setItem(key, JSON.stringify(val)); }
    catch (e) { storageOk = false; }
  }
  function getSession() { return readJSON(SESSION_KEY, null); }
  function getUsers() { var u = readJSON(USERS_KEY, []); return Array.isArray(u) ? u : []; }

  }

  function emptyIup() { return { profile: "", goal: "", exams: [], subjects: [], vuz: [], olymps: [], mode: "", control: "" }; }
  function emptyIom() { return { goal: "", stages: [], points: [], resources: "", deviation: "" }; }
  function emptyJournal() {
    return {
      weeks: BASE_WEEKS.map(function (w) { return { m: w[0], w: w[1], task: "", fact: "", status: "Не начато", q: "" }; }),
      errors: [],
      reflection: []
    };
  }
  function seedFor(login) { var s = SEED[login]; return s ? JSON.parse(JSON.stringify(s)) : null; }
  function noIup(d) { return !d || (!(d.goal || "").trim() && !(d.exams || []).length && !(d.subjects || []).length); }
  function noIom(d) { return !d || (!(d.goal || "").trim() && !(d.stages || []).length && !(d.points || []).length); }
  function noJournal(d) { return !d || !(d.weeks || []).length || !(d.weeks || []).some(function (w) { return (w.task || "").trim(); }); }
  function buildPupil(u) {
    var seed = seedFor(u.login);
    var li = loadDoc("iup", u.login);
    var lm = loadDoc("iom", u.login);
    var lj = loadDoc("journal", u.login);
    var iup = noIup(li) ? ((seed && seed.iup) || li || emptyIup()) : li;
    var iom = noIom(lm) ? ((seed && seed.iom) || lm || emptyIom()) : lm;
    var journal = noJournal(lj) ? ((seed && seed.journal) || lj || emptyJournal()) : lj;
    if (typeof journal.reflection === "string") journal.reflection = [];
    return {
      id: u.login, login: u.login,
      fio: u.fio || u.login,
      klass: u.klass || "",
      focus: (iup.goal || "").trim().slice(0, 90) || (u.ou || "маршрут не заполнен"),
      iup: iup, iom: iom,
      weeks: journal.weeks || [],
      errors: journal.errors || [],
      reflection: journal.reflection || []
    };
  }

  var session = getSession();
  var me = session ? userByLogin(session.login) : null;
  var data = { tutor: { name: "", cabinet: "" }, pupils: [] };
  var state = { role: null, pupilId: null, doc: "journal", tab: "plan", arch: false };

  if (me && session.role === "shkolnik") {
    var selfPupil = buildPupil(me);
    var tutorUser = me.tutorId ? userByLogin(me.tutorId) : null;
    data.tutor = { name: tutorUser ? (tutorUser.fio || tutorUser.login) : "не назначен", cabinet: "Тьютор" };
    data.pupils = [selfPupil];
    state.role = "pupil";
    state.pupilId = me.login;
  } else if (me && session.role === "tyutor") {
    data.tutor = { name: me.fio || me.login, cabinet: "Тьютор" };
    data.pupils = getUsers().filter(function (u) {
      return u.role === "shkolnik" && u.tutorId === me.login;
    }).map(buildPupil);
    state.role = "tutor";
  }

  function savePupil(p) {
    saveDoc("iup", p.login, p.iup);
    saveDoc("iom", p.login, p.iom);
    saveDoc("journal", p.login, { weeks: p.weeks, errors: p.errors, reflection: p.reflection });
  }
  function save() { (data.pupils || []).forEach(savePupil); }

  function pupil(id) {
    for (var i = 0; i < data.pupils.length; i++) if (data.pupils[i].id === id) return data.pupils[i];
    return null;
  }
  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function filledCount(p) {
    if (!p.weeks) return 0;
    return p.weeks.filter(function (w) { return (w.fact || "").trim() || (w.status && w.status !== "Не начато"); }).length;
  }
  function pct(p) {
    if (!p.weeks || !p.weeks.length) return 0;
    return Math.round(filledCount(p) * 100 / p.weeks.length);
  }
  function waitingCount(p) {
    if (!p.weeks) return 0;
    return p.weeks.filter(function (w) { return (w.q || "").trim() && !(w.res && w.res.text); }).length;
  }
  function hasDocs(p) {
    if (!p) return false;
    if (p.iup && (p.iup.goal || "").trim()) return true;
    return (p.weeks || []).some(function (w) { return (w.fact || "").trim(); });
  }

  function progressBlock(p) {
    var total = p.weeks ? p.weeks.length : 0;
    var done = filledCount(p);
    var errs = (p.errors || []).length;
    var redone = (p.errors || []).filter(function (e) { return e.redone === "1"; }).length;
    var wait = waitingCount(p);
    return '<div class="progress">' +
      '<div class="bar"><div class="fill" style="width:' + pct(p) + '%"></div></div>' +
      '<div class="stats">' +
        '<span><b>' + pct(p) + '%</b> недель отмечено (' + done + ' из ' + total + ')</span>' +
        '<span>ошибок: <b>' + errs + '</b>, перерешено <b>' + redone + '</b></span>' +
        '<span>вопросов тьютору: <b>' + wait + '</b></span>' +
        '<span>' + (storageOk ? 'сохранение в этом браузере' : 'сохранение недоступно — режим просмотра') + '</span>' +
      '</div>' +
    '</div>';
  }

  function docText(label, attr, list, idx, key, value, readOnly) {
    if (readOnly) {
      return '<div class="field"><label>' + esc(label) + '</label><div class="ro-text">' + esc(value || "—") + '</div></div>';
    }
    var a = ' data-' + attr + '="' + list + '"';
    if (idx !== null) a += ' data-idx="' + idx + '"';
    if (key) a += ' data-key="' + key + '"';
    return '<div class="field"><label>' + esc(label) + '</label><textarea' + a + '>' + esc(value || "") + '</textarea></div>';
  }
  function docTable(attr, list, rows, cols, readOnly) {
    if (!Array.isArray(rows) || !rows.length) return '<p class="muted" style="font-size:.85rem">Нет данных.</p>';
    var head = '<tr>' + cols.map(function (c) { return '<th>' + esc(c[1]) + '</th>'; }).join("") + '</tr>';
    var body = rows.map(function (row, i) {
      return '<tr>' + cols.map(function (c) {
        var v = row[c[0]] || "";
        if (readOnly) return '<td>' + (esc(v) || '<span class="muted">—</span>') + '</td>';
        return '<td><input data-' + attr + '="' + list + '" data-idx="' + i + '" data-key="' + c[0] + '" value="' + esc(v) + '"></td>';
      }).join("") + '</tr>';
    }).join("");
    return '<div class="table-wrap"><table class="week-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }
  function docSection(title, inner) {
    return '<div class="doc-section"><h3>' + esc(title) + '</h3>' + inner + '</div>';
  }

    var d = p.iup || {};
    var html = "";
    html += docSection("Общая информация", docText("Класс, профиль, школа", "iup", "profile", null, null, d.profile, readOnly));
    html += docSection("Цель поступления", docText("Куда и зачем", "iup", "goal", null, null, d.goal, readOnly));
    html += docSection("Экзамены и целевые баллы", docTable("iup", "exams", d.exams, [["s", "Предмет"], ["t", "Целевой балл"]], readOnly));
    html += docSection("Предметы и часы", docTable("iup", "subjects", d.subjects, [["s", "Предмет"], ["h", "Часы"], ["n", "Что входит"]], readOnly));
    html += docSection("Целевые вузы", docTable("iup", "vuz", d.vuz, [["s", "Вуз"], ["p", "Программа"], ["b", "Проходной / условия"]], readOnly));
    html += docSection("Олимпиады и сроки", docTable("iup", "olymps", d.olymps, [["s", "Олимпиада"], ["l", "Уровень"], ["w", "Когда"]], readOnly));
    html += docSection("Режим и самоподготовка", docText("Как устроена неделя", "iup", "mode", null, null, d.mode, readOnly));
    html += docSection("Система контроля", docText("Как проверяется движение", "iup", "control", null, null, d.control, readOnly));
    return '<div class="panel"><h2>ИУП — индивидуальный учебный план</h2>' +
      '<p class="hint">Что изучаю, на каком уровне и с какой целью. Заполняется вместе с тьютором и правится в течение года.</p>' + html + '</div>';
  }

  function docIom(p, readOnly) {
    var d = p.iom || {};
    var html = "";
    html += docSection("Цель маршрута", docText("Что должно получиться", "iom", "goal", null, null, d.goal, readOnly));
    html += docSection("Этапы", docTable("iom", "stages", d.stages, [["s", "Этап"], ["t", "Что делаю"]], readOnly));
    html += docSection("Контрольные точки", docTable("iom", "points", d.points, [["w", "Когда"], ["what", "Что проверяю"], ["crit", "Критерий"]], readOnly));
    html += docSection("Ресурсы", docText("Чем пользуюсь", "iom", "resources", null, null, d.resources, readOnly));
    html += docSection("Если отстаю", docText("План при отклонении", "iom", "deviation", null, null, d.deviation, readOnly));
    return '<div class="panel"><h2>ИОМ — индивидуальный образовательный маршрут</h2>' +
      '<p class="hint">Куда иду и как проверяю движение: этапы, контрольные точки, ресурсы и что делать при отставании.</p>' + html + '</div>';
  }

  function weeksTable(p, readOnly) {
    var ro = readOnly ? " disabled" : "";
    var rows = "";
    var currentMonth = "";
    p.weeks.forEach(function (w, i) {
      if (w.m !== currentMonth) {
        currentMonth = w.m;
        rows += '<tr class="month-row"><td colspan="6">' + esc(currentMonth) + '</td></tr>';
      }
      var done = (w.fact || "").trim() || (w.status && w.status !== "Не начато");
      rows += '<tr class="' + (done ? "done" : "") + '">' +
        '<td class="w-check"><input type="checkbox" data-week="' + i + '" data-key="done"' + (done ? " checked" : "") + ro + ' aria-label="Неделя выполнена"></td>' +
        '<td class="w-date">' + esc(w.w) + '</td>' +
        '<td>' + (readOnly ? (w.task ? esc(w.task) : '<span class="muted">—</span>') : '<textarea data-week="' + i + '" data-key="task" placeholder="тема / контрольная точка недели">' + esc(w.task) + '</textarea>') + '</td>' +
        '<td><textarea data-week="' + i + '" data-key="fact"' + ro + ' placeholder="что фактически сделал">' + esc(w.fact) + '</textarea></td>' +
        '<td><select data-week="' + i + '" data-key="status"' + ro + '>' +
          ["Не начато", "В работе", "Сделано", "Пропущено"].map(function (s) {
            return '<option value="' + s + '"' + (w.status === s ? " selected" : "") + '>' + s + '</option>';
          }).join("") +
        '</select></td>' +
        '<td>' + (readOnly
          ? (w.q ? esc(w.q) : '<span class="muted">—</span>')
          : '<input data-week="' + i + '" data-key="q" value="' + esc(w.q) + '" placeholder="вопрос тьютору">') + '</td>' +
      '</tr>';
      if (w.res && w.res.text) {
        rows += '<tr class="res-row"><td></td><td colspan="5"><div class="res-box"><b>' + esc(w.res.status || "Резолюция") + '</b>' +
          esc(w.res.text) + '<div class="who">' + esc(w.res.date || "") + ' · ' + esc(data.tutor.name) + '</div></div></td></tr>';
      }
    });
    return '<div class="table-wrap"><table class="week-table"><thead><tr>' +
      '<th style="width:42px">✓</th><th style="width:104px">Неделя</th><th style="width:28%">Контрольная точка</th>' +
      '<th style="width:24%">Факт</th><th style="width:112px">Статус</th><th>Вопрос тьютору</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function errSeenChip(e) {
    return e.seen === "1"
      ? '<span class="chip ok">просмотрено тьютором</span>'
      : '<span class="chip">не просмотрено</span>';
  }
  function tutorNoteBlock(t, emptyText) {
    if (t && t.text) {
      return '<div class="res-box"><b>Комментарий тьютора</b>' + esc(t.text) +
        (t.date ? '<div class="who">' + esc(t.date) + ' · ' + esc(data.tutor.name) + '</div>' : '') + '</div>';
    }
    return '<div class="res-box empty">' + esc(emptyText || "Комментария пока нет") + '</div>';
  }

  function errorsBlock(p, readOnly) {
    var items = p.errors || [];
    var head = '<div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.6rem">' +
      '<div class="muted" style="font-size:.85rem">Записей: <b>' + items.length + '</b></div>' +
      (readOnly ? "" : '<button class="btn solid small" data-act="add-err">+ Добавить ошибку</button>') +
    '</div>';
    if (!items.length) {
      return head + '<div class="empty-state">Записей пока нет. Первая ошибка — первая запись: что решал, где ошибся, как правильно.</div>';
    }
    var list = items.map(function (e, i) {
      var body;
      if (readOnly) {
        body = '<div class="err-line"><span>Дата:</span> ' + esc(e.date) + '</div>' +
          '<div class="err-line"><span>В чём ошибся:</span> ' + esc(e.wrong) + '</div>' +
          '<div class="err-line"><span>Правильный ход:</span> ' + esc(e.right) + '</div>';
      } else {
        body = '<div class="grid2">' +
            '<div class="field"><label>Дата</label><input type="date" data-err="' + i + '" data-key="date" value="' + esc(e.date) + '"></div>' +
            '<div class="field"><label>Тема / задача</label><input data-err="' + i + '" data-key="topic" value="' + esc(e.topic) + '" placeholder="например: физика, второй закон Ньютона"></div>' +
          '</div>' +
          '<div class="field"><label>В чём ошибся</label><input data-err="' + i + '" data-key="wrong" value="' + esc(e.wrong) + '" placeholder="одной фразой"></div>' +
          '<div class="field"><label>Правильный ход</label><input data-err="' + i + '" data-key="right" value="' + esc(e.right) + '" placeholder="как надо было"></div>';
      }
      var actions = readOnly ? "" :
        '<div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.35rem">' +
          '<button class="btn small" data-act="redone" data-idx="' + i + '">' + (e.redone === "1" ? "Снять «перерешено»" : "Отметить перерешено") + '</button>' +
          '<button class="btn small ghost" data-act="del-err" data-idx="' + i + '">Удалить</button>' +
        '</div>';
      return '<div class="err-item">' +
        '<div class="top"><b>' + esc(e.topic || "Без темы") + '</b><span>' +
          (e.redone === "1" ? '<span class="chip ok">перерешено</span> ' : '<span class="chip warn">не перерешено</span> ') +
          errSeenChip(e) + '</span></div>' +
        body + tutorNoteBlock(e.tutor, "Комментария тьютора пока нет") + actions +
      '</div>';
    }).join("");
    return head + '<div class="err-list">' + list + '</div>';
  }

  var LIGHTS = { g: "🟢", y: "🟡", r: "🔴" };
  function nextWeekLabel(p) {
    var used = {};
    (p.reflection || []).forEach(function (r) { used[r.week] = 1; });
    for (var i = 0; i < BASE_WEEKS.length; i++) {
      if (!used[BASE_WEEKS[i][1]]) return BASE_WEEKS[i][1];
    }
    return BASE_WEEKS[BASE_WEEKS.length - 1][1];
  }

  function reflectionBlock(p, readOnly) {
    var items = p.reflection || [];
    if (typeof items === "string") items = [];
    var head = '<div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.6rem">' +
      '<div class="muted" style="font-size:.85rem">Записей по неделям: <b>' + items.length + '</b></div>' +
      (readOnly ? "" : '<button class="btn solid small" data-act="add-refl">+ Добавить неделю</button>') +
    '</div>' +
    '<details class="howto" open><summary>Зачем светофор и что писать в полях</summary><div class="howto-body">' +
      '<p><b>Светофор — это оценка недели, а не оценка тебя.</b> Он нужен, чтобы за секунду вспомнить, как прошла неделя, и чтобы тьютор видел картину, не читая все записи:</p>' +
      '<ul>' +
        '<li>🟢 — неделя получилась: план выполнен или почти выполнен;</li>' +
        '<li>🟡 — частично: что-то сделал, что-то нет — так бывает чаще всего;</li>' +
        '<li>🔴 — было тяжело: не успел, заболел, тема не пошла.</li>' +
      '</ul>' +
      '<p class="muted">Отмечать не обязательно: не хочется — оставь пусто. Повторный клик по выбранному кружку снимает выбор.</p>' +
      '<p><b>Что писать в полях:</b></p>' +
      '<ul>' +
        '<li><b>Что получилось</b> — конкретные дела: какие темы разобрал, сколько задач решил, что уже делаешь без подсказки. Пример: «разобрал многочлены, решил 18 задач, ошибся в двух».</li>' +
        '<li><b>Что не получилось и почему</b> — где застрял и чего не хватило: времени, понимания, материала. Пример: «писал сочинение два часа, не уложился в таймер».</li>' +
        '<li><b>Что понял(а) про себя</b> — про свой способ работы, а не про предмет. Пример: «утром получается лучше, вечером отвлекаюсь».</li>' +
        '<li><b>План на следующую неделю</b> — 1–3 конкретных действия с объёмом. Пример: «3 сочинения по 40 минут; повторить тригонометрию».</li>' +
      '</ul>' +
      '<p class="muted">Пиши коротко, одной-двумя фразами: это рабочие заметки для тебя и тьютора, а не сочинение.</p>' +
    '</div></details>';
    if (!items.length) {
      return head + '<div class="empty-state">Пока нет ни одной записи. Нажмите «Добавить неделю» — предыдущие записи сохранятся.</div>';
    }
    var list = items.map(function (r, i) {
      var body = readOnly
        ? '<div class="err-line"><span>Что получилось:</span> ' + esc(r.ok || "—") + '</div>' +
          '<div class="err-line"><span>Что не получилось:</span> ' + esc(r.no || "—") + '</div>' +
          '<div class="err-line"><span>Что понял(а):</span> ' + esc(r.self || "—") + '</div>' +
          '<div class="err-line"><span>План на неделю:</span> ' + esc(r.next || "—") + '</div>'
        : '<div class="field"><label>Что получилось</label><input data-refl="' + i + '" data-key="ok" value="' + esc(r.ok) + '" placeholder="например: разобрал многочлены, решил 18 задач"></div>' +
          '<div class="field"><label>Что не получилось и почему</label><input data-refl="' + i + '" data-key="no" value="' + esc(r.no) + '" placeholder="например: сочинение писал 2 часа, не уложился"></div>' +
          '<div class="field"><label>Что понял(а) про себя</label><input data-refl="' + i + '" data-key="self" value="' + esc(r.self) + '" placeholder="например: утром работаю лучше, вечером отвлекаюсь"></div>' +
          '<div class="field"><label>План на следующую неделю</label><input data-refl="' + i + '" data-key="next" value="' + esc(r.next) + '" placeholder="например: 3 сочинения по 40 минут"></div>';
      var lights;
      if (readOnly) {
        lights = '<span style="font-size:1.05rem">' +
          (LIGHTS[r.light] || '<span class="muted" style="font-size:.8rem">не отмечено</span>') + '</span>';
      } else {
        lights = '<span class="lights">' + ["g", "y", "r"].map(function (k) {
          return '<button class="light' + (r.light === k ? " active" : "") + '" data-act="light" data-idx="' + i + '" data-val="' + k + '" title="' +
            (k === "g" ? "получилось" : k === "y" ? "частично" : "было тяжело") + ' — нажми ещё раз, чтобы снять">' + LIGHTS[k] + '</button>';
        }).join("") + (r.light ? "" : '<span class="light-hint">не отмечено</span>') + '</span>';
      }
      var seen = (r.tutor && r.tutor.seen)
        ? ' <span class="chip ok">просмотрено тьютором</span>'
        : (readOnly ? "" : ' <span class="chip">не просмотрено</span>');
      var actions = readOnly ? "" :
        '<button class="btn small ghost" data-act="del-refl" data-idx="' + i + '">Удалить неделю</button>';
      return '<div class="refl-item">' +
        '<div class="top"><b>' + esc(r.week) + '</b><span>' + lights + seen + '</span></div>' +
        body + tutorNoteBlock(r.tutor, "Комментария тьютора пока нет") +
        '<div style="margin-top:.35rem">' + actions + '</div>' +
      '</div>';
    }).join("");
    return head + '<div class="refl-list">' + list + '</div>';
  }

  function journalDoc(p, readOnly) {
    var tabs = '<div class="tabs">' +
      '<button class="' + (state.tab === "plan" ? "active" : "") + '" data-act="tab" data-tab="plan">План недель</button>' +
      '<button class="' + (state.tab === "errors" ? "active" : "") + '" data-act="tab" data-tab="errors">Ошибки</button>' +
      '<button class="' + (state.tab === "refl" ? "active" : "") + '" data-act="tab" data-tab="refl">Рефлексия</button>' +
    '</div>';
    var body = "";
    if (state.tab === "plan") {
      body = weeksTable(p, readOnly);
    } else if (state.tab === "errors") {
      body = errorsBlock(p, readOnly);
    } else {
      body = reflectionBlock(p, readOnly);
    }
    return '<div class="panel"><h2>Журнал ошибок и рефлексии</h2>' +
      '<p class="hint">План недель с сентября по январь; каждая неделя — контрольная точка из ИУП. Ошибки и рефлексию можно добавлять в любой момент: прошлые записи сохраняются.</p>' +
      tabs + body + '</div>';
  }

  function checksDoc(p, readOnly) {
    var ro = readOnly ? " disabled" : "";
    var months = {};
    p.weeks.forEach(function (w, i) {
      months[w.m] = months[w.m] || [];
      months[w.m].push({ w: w, i: i });
    });
    var html = Object.keys(months).map(function (m) {
      return '<div class="panel"><h2>' + esc(m) + '</h2>' +
        months[m].map(function (x) {
          var done = (x.w.fact || "").trim() || (x.w.status && x.w.status !== "Не начато");
          return '<div style="display:flex;gap:.6rem;align-items:flex-start;border-bottom:1px dashed var(--line);padding:.4rem 0">' +
            '<input type="checkbox" data-check="' + x.i + '"' + (done ? " checked" : "") + ro + '>' +
            '<div style="flex:1"><b style="font-size:.87rem">' + esc(x.w.w) + '</b>' +
            '<div class="muted" style="font-size:.82rem">' + esc(x.w.task || "—") + '</div></div></div>';
        }).join("") + '</div>';
    }).join("");
    return '<div class="panel"><h2>Чек-фиксации по неделям</h2>' +
      '<p class="hint">Быстрая отметка: неделя закрыта или нет. Совпадает с колонкой «Факт» в журнале.</p></div>' + html;
  }

  /* ---------- кабинет школьника ---------- */
  function renderPupil() {
    var p = pupil(state.pupilId);
    if (!p) return renderLogin();
    var content = "";
    if (state.doc === "iup") content = docIup(p, false);
    else if (state.doc === "iom") content = docIom(p, false);
    else content = journalDoc(p, false);

    return '<div class="cabinet">' + railPupil(p) +
      '<main class="main">' +
        '<div class="head"><div>' +
          '<h1>' + esc(p.fio) + '</h1>' +
          '<div class="sub">' + esc(p.klass) + ' · ' + esc(p.focus) + '</div>' +
        '</div><div><span class="chip teal">кабинет школьника</span></div></div>' +
        progressBlock(p) +
        content +
        (state.doc === "journal" && state.tab === "plan"
          ? '<div class="savebar"><span class="status' + (storageOk ? "" : " ok") + '">' +
              (storageOk ? 'Изменения сохраняются автоматически' : 'Сохранение недоступно — данные только в памяти') +
            '</span><button class="btn solid" data-act="send">Отправить тьютору</button>' +
            '<button class="btn ghost" data-act="export">Скачать мои данные</button></div>'
          : '') +
        (state.arch ? renderArch() : "") +
      '</main></div>';
  }

  /* ---------- кабинет тьютора ---------- */
  function resolutionCell(w) {
    if (!w.res || !w.res.text) {
      return '<div class="res-box empty">Резолюции пока нет</div>';
    }
    return '<div class="res-box"><b>' + esc(w.res.status || "Комментарий") + '</b>' +
      esc(w.res.text) + '<div class="who">' + esc(w.res.date || "") + ' · ' + esc(data.tutor.name) + '</div></div>';
  }

  function tutorWeeks(p) {
    var rows = "";
    var currentMonth = "";
    p.weeks.forEach(function (w, i) {
      if (w.m !== currentMonth) {
        currentMonth = w.m;
        rows += '<tr class="month-row"><td colspan="6">' + esc(currentMonth) + '</td></tr>';
      }
      rows += '<tr class="' + (((w.fact || "").trim()) ? "done" : "") + '">' +
        '<td class="w-date">' + esc(w.w) + '</td>' +
        '<td>' + esc(w.task || "—") + '</td>' +
        '<td>' + ((w.fact || "").trim() ? esc(w.fact) : '<span class="muted">не отмечено</span>') + '</td>' +
        '<td><span class="chip ' + (w.status === "Сделано" ? "ok" : w.status === "Пропущено" ? "warn" : "") + '">' + esc(w.status) + '</span></td>' +
        '<td>' + ((w.q || "").trim() ? esc(w.q) : '<span class="muted">—</span>') + '</td>' +
        '<td>' + resolutionCell(w) + '</td>' +
      '</tr>';
    });
    return '<div class="table-wrap"><table class="week-table"><thead><tr>' +
      '<th style="width:104px">Неделя</th><th style="width:24%">Контрольная точка</th>' +
      '<th style="width:24%">Факт ученика</th><th style="width:110px">Статус</th>' +
      '<th style="width:18%">Вопрос тьютору</th><th>Резолюция</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function tutorErrors(p) {
    var items = p.errors || [];
    if (!items.length) return '<div class="empty-state">Ошибок пока нет.</div>';
    return items.map(function (e, i) {
      return '<div class="err-item">' +
        '<div class="top"><b>' + esc(e.topic || "Без темы") + '</b><span>' +
          (e.redone === "1" ? '<span class="chip ok">перерешено</span> ' : '<span class="chip warn">не перерешено</span> ') +
          errSeenChip(e) + '</span></div>' +
        '<div class="err-line"><span>Дата:</span> ' + esc(e.date) + '</div>' +
        '<div class="err-line"><span>Ошибка:</span> ' + esc(e.wrong) + '</div>' +
        '<div class="err-line"><span>Правильный ход:</span> ' + esc(e.right) + '</div>' +
        '<div class="field" style="margin-top:.45rem"><label>Комментарий тьютора (видит ученик)</label>' +
          '<input data-terr="' + i + '" data-key="text" value="' + esc((e.tutor && e.tutor.text) || "") + '" placeholder="что проверил, что исправить"></div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:.4rem">' +
          '<button class="btn small solid" data-act="save-terr" data-idx="' + i + '">Сохранить комментарий</button>' +
          '<button class="btn small" data-act="seen-err" data-idx="' + i + '">' + (e.seen === "1" ? "Снять «просмотрено»" : "Отметить просмотрено") + '</button>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  function tutorReflection(p) {
    var items = (p.reflection && p.reflection.length) ? p.reflection : [];
    if (!items.length) return '<div class="empty-state">Записей рефлексии пока нет.</div>';
    return items.map(function (r, i) {
      var seen = (r.tutor && r.tutor.seen) ? '<span class="chip ok">просмотрено</span>' : '<span class="chip">не просмотрено</span>';
      return '<div class="refl-item">' +
        '<div class="top"><b>' + esc(r.week) + '</b><span>' + (LIGHTS[r.light] || '<span class="muted" style="font-size:.78rem">не отмечено</span>') + ' ' + seen + '</span></div>' +
        '<div class="err-line"><span>Что получилось:</span> ' + esc(r.ok || "—") + '</div>' +
        '<div class="err-line"><span>Что не получилось:</span> ' + esc(r.no || "—") + '</div>' +
        '<div class="err-line"><span>Что понял(а):</span> ' + esc(r.self || "—") + '</div>' +
        '<div class="err-line"><span>План:</span> ' + esc(r.next || "—") + '</div>' +
        '<div class="field" style="margin-top:.45rem"><label>Комментарий тьютора (видит ученик)</label>' +
          '<input data-trefl="' + i + '" data-key="text" value="' + esc((r.tutor && r.tutor.text) || "") + '" placeholder="что поддержать, что скорректировать"></div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:.4rem">' +
          '<button class="btn small solid" data-act="save-trefl" data-idx="' + i + '">Сохранить комментарий</button>' +
          '<button class="btn small" data-act="seen-refl" data-idx="' + i + '">' + ((r.tutor && r.tutor.seen) ? "Снять «просмотрено»" : "Отметить просмотрено") + '</button>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  function tutorResolutionPanel(p) {
    var pending = [];
    p.weeks.forEach(function (w, i) {
      if (((w.fact || "").trim() || (w.q || "").trim()) && !(w.res && w.res.text)) pending.push(i);
    });
    if (!pending.length) {
      return '<p class="hint">Все отправленные недели проверены. Новые появятся, когда ученик внесёт факт или задаст вопрос.</p>';
    }
    return '<p class="hint">Отметьте неделю, напишите комментарий и сохраните. Ученик увидит резолюцию в своём плане недель.</p>' +
      pending.map(function (i) {
        var w = p.weeks[i];
        return '<div class="err-item" style="margin-bottom:.6rem">' +
          '<div class="top"><b>' + esc(w.w) + '</b><span class="chip gold">ждёт проверки</span></div>' +
          '<div class="err-line"><span>Факт:</span> ' + esc(w.fact || "—") + '</div>' +
          '<div class="err-line"><span>Вопрос:</span> ' + esc(w.q || "—") + '</div>' +
          '<div class="grid2" style="margin-top:.5rem">' +
            '<div class="field"><label>Статус</label><select data-res="' + i + '" data-key="status">' +
              ["Принято", "На доработку", "Комментарий"].map(function (s) {
                return '<option>' + s + '</option>';
              }).join("") + '</select></div>' +
            '<div class="field"><label>Дата</label><input type="date" data-res="' + i + '" data-key="date" value="' + new Date().toISOString().slice(0, 10) + '"></div>' +
          '</div>' +
          '<div class="field"><label>Комментарий ученику</label><textarea data-res="' + i + '" data-key="text" placeholder="что проверил, что исправить, что делать дальше"></textarea></div>' +
          '<button class="btn solid small" data-act="save-res" data-idx="' + i + '">Сохранить резолюцию</button>' +
        '</div>';
      }).join("");
  }

  function tutorFeed() {
    var items = [];
    data.pupils.forEach(function (p) {
      if (!hasDocs(p)) return;
      p.weeks.forEach(function (w) {
        if ((w.fact || "").trim()) items.push({ p: p.fio, w: w.w, t: w.fact, res: !!(w.res && w.res.text) });
      });
    });
    items = items.slice(-6).reverse();
    if (!items.length) return "";
    return '<div class="panel"><h2>Последние действия</h2><div class="feed">' +
      items.map(function (x) {
        return '<div class="feed-item"><span class="t">' + esc(x.w) + '</span>' +
          '<span><b>' + esc(x.p) + '</b> — ' + esc(x.t).slice(0, 110) +
          (x.res ? ' <span class="chip ok">проверено</span>' : ' <span class="chip gold">ждёт</span>') + '</span></div>';
      }).join("") + '</div></div>';
  }

  function renderTutor() {
    var p = pupil(state.pupilId);
    var list = p ? "" : '<div class="panel"><h2>Мои ученики</h2>' +
      '<p class="hint">Прогресс — доля недель с отметкой. Жёлтый счётчик — вопросы и записи, ждущие резолюции.</p>' +
      '<div class="pupil-list">' +
        data.pupils.map(function (x) {
          var w = waitingCount(x);
          return '<div class="pupil-row' + (state.pupilId === x.id ? " active" : "") + '" data-act="pupil" data-id="' + x.id + '">' +
            '<div><div class="nm">' + esc(x.fio) + '</div><div class="cl">' + esc(x.focus) + '</div></div>' +
            '<div><div class="mini"><i style="width:' + pct(x) + '%"></i></div>' +
              '<div class="cl" style="margin-top:.2rem">' + (hasDocs(x) ? pct(x) + '% недель' : 'документы не заполнены') + '</div></div>' +
            '<div>' + (w ? '<span class="chip gold">' + w + ' ждёт</span>' : '<span class="chip">нет вопросов</span>') + '</div>' +
          '</div>';
        }).join("") +
      '</div></div>';

    var body = "";
    if (!p) {
      body = '<div class="empty-state">Выберите ученика слева — откроются его документы и резолюции.</div>';
    } else if (!hasDocs(p)) {
      body = '<div class="panel"><h2>' + esc(p.fio) + '</h2>' +
        '<p class="hint">' + esc(p.focus) + '</p>' +
        '<div class="empty-state">Ученик ещё не заполнял документы. Можно отправить напоминание и шаблон ИУП.</div>' +
        '<button class="btn small" data-act="remind" data-id="' + p.id + '">Напомнить о заполнении</button></div>';
    } else {
      body = '<div class="head"><div><h1>' + esc(p.fio) + '</h1>' +
          '<div class="sub">' + esc(p.klass) + ' · ' + esc(p.focus) + '</div></div>' +
          '<div><span class="chip gold">кабинет тьютора</span></div></div>' +
        progressBlock(p) +
        '<div class="panel"><h2>Документы ученика</h2>' +
          '<p class="hint">Тьютор видит заполненное, но не редактирует документы ученика — только оставляет резолюции.</p>' +
          '<div class="tabs">' +
            DOCS.map(function (d) {
              return '<button class="' + (state.doc === d.id ? "active" : "") + '" data-act="doc" data-doc="' + d.id + '">' + esc(d.name) + '</button>';
            }).join("") +
          '</div>' +
          (state.doc === "iup" ? docIup(p, true) :
           state.doc === "iom" ? docIom(p, true) :
           ('<div class="tabs">' +
              '<button class="' + (state.tab === "plan" ? "active" : "") + '" data-act="tab" data-tab="plan">План недель</button>' +
              '<button class="' + (state.tab === "res" ? "active" : "") + '" data-act="tab" data-tab="res">Резолюции</button>' +
              '<button class="' + (state.tab === "errors" ? "active" : "") + '" data-act="tab" data-tab="errors">Ошибки</button>' +
              '<button class="' + (state.tab === "refl" ? "active" : "") + '" data-act="tab" data-tab="refl">Рефлексия</button>' +
            '</div>' +
            (state.tab === "errors" ? tutorErrors(p) :
             state.tab === "refl" ? tutorReflection(p) :
             state.tab === "res" ? tutorResolutionPanel(p) : tutorWeeks(p)))) +
        '</div>';
    }

    if (p) body = '<div style="margin-bottom:.6rem"><button class="btn small ghost" data-act="back-list">← ко всем ученикам</button></div>' + body;

    return '<div class="cabinet">' + railTutor() +
      '<main class="main">' + list + body + (state.arch ? renderArch() : "") + '</main></div>';
  }

  /* ---------- рендер ---------- */
  function labelControls() {
    var table = document.querySelector("table.week-table");
    var heads = table ? table.querySelectorAll("thead th") : [];
    Array.prototype.forEach.call(document.querySelectorAll("input, select, textarea"), function (el) {
      if (el.getAttribute("aria-label") || el.getAttribute("aria-labelledby")) return;
      var name = "";
      var field = el.closest(".field");
      if (field) {
        var lab = field.querySelector("label");
        if (lab) name = lab.textContent.trim();
      }
      if (!name && el.getAttribute("placeholder")) name = el.getAttribute("placeholder");
      if (!name && el.type === "checkbox") {
        var wrap = el.closest("div");
        var b = wrap ? wrap.querySelector("b") : null;
        if (b) name = "Отметка недели " + b.textContent.trim();
      }
      if (!name) {
        var td = el.closest("td");
        var tr = el.closest("tr");
        if (td && tr && heads.length) {
          var cells = Array.prototype.slice.call(tr.children);
          var idx = cells.indexOf(td);
          if (idx >= 0 && heads[idx]) name = heads[idx].textContent.trim();
        }
      }
      el.setAttribute("aria-label", name || "Поле ввода");
    });
  }

  function render() {
    var app = document.getElementById("app");
    if (!state.role) { app.innerHTML = renderLogin(); labelControls(); return; }
    if (state.role === "pupil") {
      if (!state.pupilId) { state.role = null; app.innerHTML = renderLogin(); labelControls(); return; }
      app.innerHTML = renderPupil();
    } else {
      app.innerHTML = renderTutor();
    }
    labelControls();
  }

  /* ---------- события ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");

    if (act === "role") {
      state.role = t.getAttribute("data-role");
      render();
    } else if (act === "enter") {
      state.role = t.getAttribute("data-role");
      state.pupilId = t.getAttribute("data-id") || state.pupilId;
      state.doc = "journal";
      state.tab = "plan";
      render();
    } else if (act === "home") {
      location.href = "../Я выбираю свою траекторию.html";
    } else if (act === "arch") {
      state.arch = true; render();
      var a = document.querySelector(".arch");
      if (a) a.scrollIntoView({ behavior: "smooth", block: "start" });
    } else if (act === "arch-close") {
      state.arch = false; render();
    } else if (act === "doc") {
      state.doc = t.getAttribute("data-doc");
      state.tab = "plan";
      render();
    } else if (act === "tab") {
      state.tab = t.getAttribute("data-tab");
      render();
    } else if (act === "pupil") {
      state.pupilId = t.getAttribute("data-id");
      state.doc = "journal";
      state.tab = "plan";
      render();
    } else if (act === "back-list") {
      state.pupilId = null;
      render();
    } else if (act === "redone") {
      var p = pupil(state.pupilId);
      var idx = parseInt(t.getAttribute("data-idx"), 10);
      if (p && p.errors[idx]) {
        p.errors[idx].redone = p.errors[idx].redone === "1" ? "0" : "1";
        save(); render();
      }
    } else if (act === "add-err") {
      var pe = pupil(state.pupilId);
      if (!pe) return;
      pe.errors = pe.errors || [];
      pe.errors.push({ date: new Date().toISOString().slice(0, 10), topic: "", wrong: "", right: "", redone: "0", seen: "0", tutor: null });
      state.tab = "errors";
      save(); render();
    } else if (act === "del-err") {
      var pd = pupil(state.pupilId);
      var di = parseInt(t.getAttribute("data-idx"), 10);
      if (pd && pd.errors && pd.errors[di] !== undefined) {
        pd.errors.splice(di, 1);
        save(); render();
      }
    } else if (act === "add-refl") {
      var pr = pupil(state.pupilId);
      if (!pr) return;
      if (!Array.isArray(pr.reflection)) pr.reflection = [];
      var prev = pr.reflection[pr.reflection.length - 1] || {};
      pr.reflection.push({
        week: nextWeekLabel(pr), light: "",
        ok: "", no: "", self: "",
        next: prev.next || "",
        date: new Date().toISOString().slice(0, 10),
        tutor: null
      });
      state.tab = "refl";
      save(); render();
      var added = document.querySelectorAll(".refl-item");
      if (added.length) added[added.length - 1].scrollIntoView({ behavior: "smooth", block: "center" });
    } else if (act === "del-refl") {
      var prd = pupil(state.pupilId);
      var ri = parseInt(t.getAttribute("data-idx"), 10);
      if (prd && prd.reflection && prd.reflection[ri] !== undefined) {
        prd.reflection.splice(ri, 1);
        save(); render();
      }
    } else if (act === "light") {
      var pl = pupil(state.pupilId);
      var li = parseInt(t.getAttribute("data-idx"), 10);
      var lv = t.getAttribute("data-val");
      if (pl && pl.reflection && pl.reflection[li]) {
        pl.reflection[li].light = (pl.reflection[li].light === lv) ? "" : lv;
        save(); render();
      }
    } else if (act === "save-terr") {
      var pte = pupil(state.pupilId);
      var tei = parseInt(t.getAttribute("data-idx"), 10);
      if (!pte || !pte.errors || !pte.errors[tei]) return;
      var tein = document.querySelector('[data-terr="' + tei + '"]');
      var tetext = tein ? tein.value.trim() : "";
      if (!tetext) { alert("Напишите комментарий ученику."); return; }
      pte.errors[tei].tutor = { text: tetext, date: new Date().toISOString().slice(0, 10) };
      pte.errors[tei].seen = "1";
      save(); render();
    } else if (act === "seen-err") {
      var pse = pupil(state.pupilId);
      var sei = parseInt(t.getAttribute("data-idx"), 10);
      if (pse && pse.errors && pse.errors[sei]) {
        pse.errors[sei].seen = pse.errors[sei].seen === "1" ? "0" : "1";
        save(); render();
      }
    } else if (act === "save-trefl") {
      var ptr = pupil(state.pupilId);
      var tri = parseInt(t.getAttribute("data-idx"), 10);
      if (!ptr || !ptr.reflection || !ptr.reflection[tri]) return;
      var trin = document.querySelector('[data-trefl="' + tri + '"]');
      var trtext = trin ? trin.value.trim() : "";
      if (!trtext) { alert("Напишите комментарий ученику."); return; }
      ptr.reflection[tri].tutor = { seen: true, text: trtext, date: new Date().toISOString().slice(0, 10) };
      save(); render();
    } else if (act === "seen-refl") {
      var psr = pupil(state.pupilId);
      var sri = parseInt(t.getAttribute("data-idx"), 10);
      if (psr && psr.reflection && psr.reflection[sri]) {
        var cur = psr.reflection[sri].tutor || { text: "", date: "" };
        cur.seen = !cur.seen;
        psr.reflection[sri].tutor = cur;
        save(); render();
      }
    } else if (act === "save-res") {
      var p2 = pupil(state.pupilId);
      var i = parseInt(t.getAttribute("data-idx"), 10);
      if (!p2 || !p2.weeks[i]) return;
      var st = document.querySelector('[data-res="' + i + '"][data-key="status"]');
      var dt = document.querySelector('[data-res="' + i + '"][data-key="date"]');
      var tx = document.querySelector('[data-res="' + i + '"][data-key="text"]');
      if (!tx || !tx.value.trim()) { alert("Напишите комментарий ученику."); return; }
      p2.weeks[i].res = {
        status: st ? st.value : "Комментарий",
        date: dt ? dt.value : new Date().toISOString().slice(0, 10),
        text: tx.value.trim()
      };
      save(); render();
    } else if (act === "send") {
      var p3 = pupil(state.pupilId);
      if (!p3) return;
      var n = 0;
      p3.weeks.forEach(function (w) {
        if ((w.fact || "").trim() && !(w.res && w.res.text)) n++;
      });
      alert(n ? "Отправлено тьютору: " + n + " недель ждут проверки." : "Нет новых записей для отправки.");
    } else if (act === "export") {
      var p4 = pupil(state.pupilId);
      if (!p4) return;
      var blob = new Blob([JSON.stringify(p4, null, 2)], { type: "application/json;charset=utf-8" });
      var a2 = document.createElement("a");
      a2.href = URL.createObjectURL(blob);
      a2.download = p4.fio + " документы.json";
      document.body.appendChild(a2); a2.click();
      setTimeout(function () { URL.revokeObjectURL(a2.href); a2.remove(); }, 500);
    } else if (act === "remind") {
      alert("Напоминание отправлено (демо). В рабочей версии — уведомление в кабинете ученика.");
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    var p = pupil(state.pupilId);
    if (!p) return;

    if (t.hasAttribute("data-doc")) {
      var doc = t.getAttribute("data-doc");
      var key = t.getAttribute("data-key");
      if (p[doc] && typeof p[doc] === "object") { p[doc][key] = t.value; }
      save();
      return;
    }
    if (t.hasAttribute("data-err")) {
      var ei = parseInt(t.getAttribute("data-err"), 10);
      var ek = t.getAttribute("data-key");
      if (p.errors && p.errors[ei]) { p.errors[ei][ek] = t.value; save(); }
      return;
    }
    if (t.hasAttribute("data-refl")) {
      var ri = parseInt(t.getAttribute("data-refl"), 10);
      var rk = t.getAttribute("data-key");
      if (p.reflection && p.reflection[ri]) { p.reflection[ri][rk] = t.value; save(); }
      return;
    }
    if (t.hasAttribute("data-iup") || t.hasAttribute("data-iom")) {
      var attrName = t.hasAttribute("data-iup") ? "iup" : "iom";
      var listName = t.getAttribute("data-" + attrName);
      var idxAttr = t.getAttribute("data-idx");
      var keyName = t.getAttribute("data-key");
      if (!p[attrName]) return;
      if (idxAttr === null) {
        p[attrName][listName] = t.value;
      } else {
        var ii = parseInt(idxAttr, 10);
        if (p[attrName][listName] && p[attrName][listName][ii]) {
          p[attrName][listName][ii][keyName] = t.value;
        }
      }
      save();
      return;
    }
    if (t.hasAttribute("data-terr")) {
      var ti = parseInt(t.getAttribute("data-terr"), 10);
      if (p.errors && p.errors[ti]) {
        p.errors[ti].tutor = p.errors[ti].tutor || { text: "", date: "" };
        p.errors[ti].tutor.text = t.value;
        save();
      }
      return;
    }
    if (t.hasAttribute("data-trefl")) {
      var tri2 = parseInt(t.getAttribute("data-trefl"), 10);
      if (p.reflection && p.reflection[tri2]) {
        p.reflection[tri2].tutor = p.reflection[tri2].tutor || { seen: false, text: "", date: "" };
        p.reflection[tri2].tutor.text = t.value;
        save();
      }
      return;
    }
    if (t.hasAttribute("data-week")) {
      var i = parseInt(t.getAttribute("data-week"), 10);
      var k = t.getAttribute("data-key");
      if (!p.weeks[i]) return;
      p.weeks[i][k] = t.value;
      if (k === "status" || k === "fact") {
        var tr = t.closest("tr");
        if (tr) {
          var done = (p.weeks[i].fact || "").trim() || (p.weeks[i].status && p.weeks[i].status !== "Не начато");
          tr.classList.toggle("done", !!done);
        }
      }
      save();
      return;
    }
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    var p = pupil(state.pupilId);
    if (!p) return;
    if (t.hasAttribute("data-check")) {
      var i = parseInt(t.getAttribute("data-check"), 10);
      if (!p.weeks[i]) return;
      p.weeks[i].status = t.checked ? "Сделано" : "Не начато";
      if (!t.checked) p.weeks[i].fact = "";
      save(); render();
      return;
    }
    if (t.hasAttribute("data-week")) {
      var j = parseInt(t.getAttribute("data-week"), 10);
      var k = t.getAttribute("data-key");
      if (!p.weeks[j]) return;
      if (k === "done") {
        p.weeks[j].status = t.checked ? "Сделано" : "Не начато";
        if (!t.checked) p.weeks[j].fact = "";
        save(); render();
        return;
      }
      p.weeks[j][k] = t.value; save();
    }
    if (t.hasAttribute("data-err")) {
      var ei2 = parseInt(t.getAttribute("data-err"), 10);
      var ek2 = t.getAttribute("data-key");
      if (p.errors && p.errors[ei2]) { p.errors[ei2][ek2] = t.value; save(); }
      return;
    }
    if (t.hasAttribute("data-refl")) {
      var ri2 = parseInt(t.getAttribute("data-refl"), 10);
      var rk2 = t.getAttribute("data-key");
      if (p.reflection && p.reflection[ri2]) { p.reflection[ri2][rk2] = t.value; save(); }
      return;
    }
  });

  render();
})();
</script>
</body>
</html>
